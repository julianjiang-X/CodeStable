{
  "id": "route-choice-owner-context",
  "fixture": "ambiguous-requirements-repo",
  "runs": 1,
  "setup": {
    "files": [
      {
        "path": ".codestable/features/2026-06-10-route-choice/route-choice-design.md",
        "content": "---\ndoc_type: feature-design\nfeature: route-choice\nstatus: draft\n---\n\n# Design\n\nRoute choice fixture.\n"
      }
    ]
  },
  "actor": {
    "context": "sterile",
    "script": [
      {"action": "read_attention"},
      {"action": "spec_router"},
      {
        "run": [
          "python3",
          ".codestable/tools/codestable-spec-governance.py",
          "--root",
          ".",
          "--json",
          "route",
          "--query",
          "source scout query coverage before crawl"
        ]
      },
      {
        "write": {
          "path": ".codestable/features/2026-06-10-route-choice/approval-report.md",
          "content": "---\ndoc_type: approval-report\nunit: .codestable/features/2026-06-10-route-choice\nstatus: pending\nreason: route-choice\ncreated_at: 2026-06-21\n---\n\n# Approval Report\n\n## Decision Needed\nChoose the canonical requirement for this source scout work.\n\n## Why Now\nContinuing design or delta work requires knowing which long-lived spec is the source of truth.\n\n## Context\nThe spec router selected multiple plausible requirement docs.\n\n## Options\n1. source-discovery: crawling entry point.\n2. source-query-coverage: query coverage evidence.\n\n## Recommendation\nStop and let the owner choose because both specs match.\n\n## Risks And Tradeoffs\nChoosing wrong writes design and deltas to the wrong boundary.\n\n## Non-Automatic Actions\nThis does not edit requirements, commit, merge, or choose for the owner.\n\n## After You Answer\nContinue design or req-delta against the selected canonical requirement.\n"
        }
      },
      {"say": "Route choice requires approval-report.md before selecting the canonical spec."},
      {"owner_stop": "route_choice"}
    ]
  },
  "expect": {
    "transcript": {
      "contains": ["Route choice requires approval-report.md"],
      "must_stop_for": ["route_choice"]
    },
    "trajectory": {
      "required_actions": ["read_attention", "spec_router", "write:.codestable/features/2026-06-10-route-choice/approval-report.md", "owner_stop:route_choice"],
      "forbidden_actions": ["rewrite_requirement", "commit", "merge"]
    },
    "commands": [
      {
        "cmd": ["python3", ".codestable/tools/codestable-spec-governance.py", "--root", ".", "--json", "route", "--query", "source scout query coverage before crawl"],
        "exit_code": 0,
        "json": [
          {"path": "clarification_required", "equals": true},
          {"path": "selected_specs", "min_len": 2}
        ]
      }
    ],
    "artifacts": {
      "must_create": [".codestable/features/2026-06-10-route-choice/approval-report.md"],
      "contains": [
        {"path": ".codestable/features/2026-06-10-route-choice/approval-report.md", "text": "canonical requirement"}
      ]
    },
    "git": {
      "must_not_modify": [".codestable/requirements/*.md", "src/**"]
    }
  }
}
