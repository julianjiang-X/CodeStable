{
  "id": "global-small-task-does-not-trigger-grill",
  "fixture": "clean-onboarded-repo",
  "runs": 1,
  "actor": {
    "context": "sterile",
    "script": [
      {"action": "read_attention"},
      {"action": "route_small_task"},
      {
        "say": "Route: cs-feat-ff\nContext: L1\nReason: small ordinary UI text tweak with no owner-heavy grill request.\nNot routing to: grill mode, because small tasks use a route/scope brief and ordinary clarifying questions only.\nEscalation: owner explicitly says `grill me`, or the task changes capability boundary, public contract, or long-lived specs.\nNext: keep the change lightweight and do not create grill-context."
      }
    ]
  },
  "expect": {
    "transcript": {
      "contains": ["Route: cs-feat-ff", "Context: L1", "small ordinary", "do not create grill-context"],
      "forbidden": ["Route: cs-brainstorm", "grill mode before final routing"]
    },
    "trajectory": {
      "required_actions": ["read_attention", "route_small_task"],
      "forbidden_actions": ["grill_mode", "grill_goal", "commit", "merge"]
    },
    "commands": [
      {
        "cmd": ["python3", "-c", "from pathlib import Path; import json; root=Path(r'{skills}'); modes=(root/'cs-onboard/reference/interaction-modes.md').read_text(encoding='utf-8'); brainstorm=(root/'cs-brainstorm/SKILL.md').read_text(encoding='utf-8'); governance=(root/'codestable-maintainer/references/global-route-governance.md').read_text(encoding='utf-8'); payload={'modes_small_task_guard': 'Small tasks must not auto-trigger full grill mode' in modes, 'brainstorm_small_task_guard': '小任务或普通不清楚只问必要澄清' in brainstorm, 'governance_small_task_scenario': 'global-small-task-does-not-trigger-grill' in governance}; print(json.dumps(payload, ensure_ascii=False, sort_keys=True))"],
        "exit_code": 0,
        "json": [
          {"path": "modes_small_task_guard", "equals": true},
          {"path": "brainstorm_small_task_guard", "equals": true},
          {"path": "governance_small_task_scenario", "equals": true}
        ]
      }
    ],
    "artifacts": {
      "must_exist": [
        ".codestable/reference/interaction-modes.md"
      ],
      "must_not_create": [
        ".codestable/brainstorms/**/grill/**",
        ".codestable/brainstorms/**",
        ".codestable/goals/**",
        ".codestable/features/**",
        ".codestable/roadmap/**"
      ]
    }
  }
}
