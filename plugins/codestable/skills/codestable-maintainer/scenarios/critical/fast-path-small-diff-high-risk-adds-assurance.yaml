{
  "id": "fast-path-small-diff-high-risk-adds-assurance",
  "fixture": "clean-onboarded-repo",
  "runs": 1,
  "actor": {
    "context": "sterile",
    "script": [
      {
        "action": "read_attention"
      },
      {
        "action": "risk_check"
      },
      {
        "say": "Route: cs-feat-ff\nScale: 1 file, 5 lines - no scale trigger fires.\nRisk fact: the change edits a permission check, which is a trust boundary.\nAdded assurance, copying the whole assurance.md row: targeted security evidence, plus a security-purpose review stacked on top of the lane floor review (加审), plus owner confirmation because tightening the role check moves the authorization boundary.\nStaying in fastforward, not switching to design.\nRisk fact -> added assurance recorded in the ff-note."
      },
      {
        "write": {
          "path": ".codestable/features/2026-06-10-tighten-role-check/tighten-role-check-ff-note.md",
          "content": "---\ndoc_type: feature-ff-note\nfeature: tighten-role-check\ndate: 2026-06-10\n---\n\n## 做了什么\n收紧一处角色校验。\n\n## 改了哪些\n- auth/roles.py:41 — 补上缺失的角色判断\n\n## 怎么验证的\n风险事实：改动落在权限判断（信任边界），且改变了授权边界。\n增加的保障（照搬 assurance.md 该行全部三项）：定向安全证据；在本通道地板 review 之外再加一轮定向安全 review（加审）；owner 确认授权边界变更。规模判据未触发，仍留在 fastforward。\n"
        }
      }
    ]
  },
  "expect": {
    "transcript": {
      "contains": [
        "no scale trigger fires",
        "trust boundary",
        "whole assurance.md row",
        "stacked on top of the lane floor review",
        "owner confirmation",
        "not switching to design"
      ]
    },
    "trajectory": {
      "required_actions": [
        "read_attention",
        "risk_check"
      ],
      "forbidden_actions": [
        "commit",
        "merge"
      ]
    },
    "artifacts": {
      "must_create": [
        ".codestable/features/2026-06-10-tighten-role-check/tighten-role-check-ff-note.md"
      ],
      "contains": [
        {
          "path": ".codestable/features/2026-06-10-tighten-role-check/tighten-role-check-ff-note.md",
          "text": "风险事实"
        },
        {
          "path": ".codestable/features/2026-06-10-tighten-role-check/tighten-role-check-ff-note.md",
          "text": "增加的保障"
        },
        {
          "path": ".codestable/features/2026-06-10-tighten-role-check/tighten-role-check-ff-note.md",
          "text": "地板 review 之外"
        },
        {
          "path": ".codestable/features/2026-06-10-tighten-role-check/tighten-role-check-ff-note.md",
          "text": "owner 确认"
        }
      ]
    },
    "commands": [
      {
        "cmd": [
          "python3",
          "{skills}/codestable-maintainer/tools/check-risk-gate.py",
          "--skills-root",
          "{skills}",
          "--json"
        ],
        "exit_code": 0,
        "json": [
          {
            "path": "ok",
            "equals": true
          },
          {
            "path": "lanes.cs-feat-ff.ok",
            "equals": true
          },
          {
            "path": "lanes.cs-feat-ff.missing_categories",
            "equals": []
          },
          {
            "path": "lanes.cs-feat-ff.takes_full_row",
            "equals": true
          },
          {
            "path": "lanes.cs-issue-fix.ok",
            "equals": true
          },
          {
            "path": "lanes.cs-refactor-ff.ok",
            "equals": true
          }
        ]
      }
    ]
  }
}
