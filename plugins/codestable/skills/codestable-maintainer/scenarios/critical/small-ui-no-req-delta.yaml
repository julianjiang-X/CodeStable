{
  "id": "small-ui-no-req-delta",
  "fixture": "ambiguous-requirements-repo",
  "runs": 1,
  "actor": {
    "context": "sterile",
    "script": [
      {"action": "read_attention"},
      {"action": "spec_router"},
      {"action": "skip_requirement_delta"},
      {"say": "Small UI tweak stays L1 and records the skip in the delivery note instead of touching requirements: no capability boundary or requirement delta, no work directory needed."}
    ]
  },
  "expect": {
    "transcript": {
      "contains": ["Small UI tweak", "stays L1", "instead of touching requirements", "no work directory needed"]
    },
    "trajectory": {
      "required_actions": ["read_attention", "spec_router", "skip_requirement_delta"],
      "forbidden_actions": ["requirement_delta", "rewrite_requirement", "commit", "merge"]
    },
    "commands": [
      {
        "cmd": ["python3", ".codestable/tools/codestable-spec-governance.py", "--root", ".", "--json", "route", "--query", "frontend-only display tweak"],
        "exit_code": 0,
        "json": [
          {"path": "allowed_to_skip_requirement_delta", "equals": true},
          {"path": "selected_specs", "equals": []}
        ]
      }
    ],
    "artifacts": {
      "must_not_create": [".codestable/features/2026-06-10-small-ui/*-req-delta.md", ".codestable/features/**/*-ff-note.md"]
    },
    "git": {
      "must_not_modify": [".codestable/requirements/*.md"]
    }
  }
}
