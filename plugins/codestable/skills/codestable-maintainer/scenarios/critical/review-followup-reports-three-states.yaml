{
  "id": "review-followup-reports-three-states",
  "fixture": "clean-onboarded-repo",
  "runs": 1,
  "actor": {
    "context": "sterile",
    "script": [
      {
        "action": "read_attention"
      },
      {
        "action": "freeze_review_target"
      },
      {
        "action": "followup_same_reviewer_session"
      },
      {
        "say": "Re-review of the refrozen target, same reviewer session as round 1.\nresolved: P1 missing null guard - fixed and covered by a new red-to-green test.\nunresolved: P1 race on the cache write - fix attempted, verification still failing.\nnew findings: P2 duplicated parsing helper introduced by the fix.\nChecked the complete current candidate, not only the previous findings."
      }
    ]
  },
  "expect": {
    "transcript": {
      "contains": [
        "resolved:",
        "unresolved:",
        "new findings:",
        "complete current candidate",
        "same reviewer session"
      ]
    },
    "trajectory": {
      "required_actions": [
        "read_attention",
        "freeze_review_target",
        "followup_same_reviewer_session"
      ],
      "forbidden_actions": [
        "create_subagent_from_reviewer",
        "commit",
        "merge"
      ]
    },
    "commands": [
      {
        "cmd": [
          "python3",
          "{skills}/codestable-maintainer/tools/check-review-protocol.py",
          "--skills-root",
          "{skills}",
          "--json"
        ],
        "exit_code": 0,
        "json": [
          {
            "path": "ok",
            "equals": true
          },
          {
            "path": "sections.### Reviewer Lineage.ok",
            "equals": true
          },
          {
            "path": "sections.### Reviewer Lineage.missing",
            "equals": []
          },
          {
            "path": "sections.### Reviewer Is A Leaf.ok",
            "equals": true
          },
          {
            "path": "sections.### Freeze The Review Target.ok",
            "equals": true
          }
        ]
      }
    ]
  }
}
