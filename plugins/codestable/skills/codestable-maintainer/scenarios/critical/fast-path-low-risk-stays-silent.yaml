{
  "id": "fast-path-low-risk-stays-silent",
  "fixture": "clean-onboarded-repo",
  "runs": 1,
  "actor": {
    "context": "sterile",
    "script": [
      {
        "action": "read_attention"
      },
      {
        "action": "risk_check"
      },
      {
        "say": "Route: cs-feat ff\nRisk check: no category hit - copy-only label change, no trust boundary, no persisted data, no concurrency, no external side effect.\nProceeding with the normal fastforward loop; no extra assurance and no extra question.\nSingle session, no contract to approve, no formal review needed: no work directory is created. The delivery note (what changed, evidence, what was not verified) goes in the final report and the commit message."
      }
    ]
  },
  "expect": {
    "transcript": {
      "contains": [
        "no category hit",
        "no extra assurance",
        "no work directory is created"
      ],
      "forbidden": [
        "风险事实",
        "增加的保障",
        "switching to design"
      ]
    },
    "trajectory": {
      "required_actions": [
        "read_attention",
        "risk_check"
      ],
      "forbidden_actions": [
        "owner_stop:assurance_required",
        "commit",
        "merge"
      ]
    },
    "artifacts": {
      "must_not_create": [
        ".codestable/features/**/*-ff-note.md",
        ".codestable/features/**/*-design.md",
        ".codestable/features/**/*-checklist.yaml"
      ]
    },
    "commands": [
      {
        "cmd": [
          "python3",
          "{skills}/codestable-maintainer/tools/check-risk-gate.py",
          "--skills-root",
          "{skills}",
          "--json"
        ],
        "exit_code": 0,
        "json": [
          {
            "path": "ok",
            "equals": true
          },
          {
            "path": "lanes.cs-feat ff.categories_present",
            "equals": 8
          }
        ]
      }
    ]
  }
}
