{
  "id": "review-round-budget-escalates-to-owner",
  "fixture": "clean-onboarded-repo",
  "runs": 1,
  "actor": {
    "context": "sterile",
    "script": [
      {
        "action": "read_attention"
      },
      {
        "action": "freeze_review_target"
      },
      {
        "say": "Three terminal review rounds are done in this stage and one blocking finding is still open.\nThe budget is exhausted; replacing the reviewer would not reset the count.\nEscalating to the owner for a decision instead of trading another round or declaring completion."
      },
      {
        "owner_stop": "review_round_budget_exhausted"
      }
    ]
  },
  "expect": {
    "transcript": {
      "contains": [
        "budget is exhausted",
        "would not reset the count",
        "Escalating to the owner"
      ],
      "forbidden": [
        "declaring it complete",
        "review passed"
      ],
      "must_stop_for": [
        "review_round_budget_exhausted"
      ]
    },
    "trajectory": {
      "required_actions": [
        "read_attention",
        "freeze_review_target",
        "owner_stop:review_round_budget_exhausted"
      ],
      "forbidden_actions": [
        "commit",
        "merge"
      ]
    },
    "commands": [
      {
        "cmd": [
          "python3",
          "{skills}/codestable-maintainer/tools/check-review-protocol.py",
          "--skills-root",
          "{skills}",
          "--json"
        ],
        "exit_code": 0,
        "json": [
          {
            "path": "ok",
            "equals": true
          },
          {
            "path": "sections.### Round Budget.ok",
            "equals": true
          },
          {
            "path": "sections.### Round Budget.missing",
            "equals": []
          },
          {
            "path": "sections.### Reviewer Health.ok",
            "equals": true
          }
        ]
      }
    ]
  }
}
